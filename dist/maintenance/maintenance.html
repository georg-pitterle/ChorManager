<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Wartungsarbeiten</title>
    <style>
        :root {
            --accent: #E8A817;
            --bg: #f7f8fb;
            --bg-end: #eef2f7;
            --surface: #ffffff;
            --border: #d9dee7;
            --text: #1f2937;
            --text-muted: #667085;
            --shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #18212b;
                --bg-end: #131a22;
                --surface: #202b38;
                --border: #2f3d4d;
                --text: #e8edf3;
                --text-muted: #9fb0c2;
                --shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background: linear-gradient(180deg, var(--bg) 0%, var(--bg-end) 100%);
            color: var(--text);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
        }

        .card {
            width: 100%;
            max-width: 32rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-top: 4px solid var(--accent);
            border-radius: 0.75rem;
            box-shadow: var(--shadow);
            padding: 2.5rem 2rem;
            text-align: center;
        }

        .icon {
            width: 4rem;
            height: 4rem;
            margin: 0 auto 1.25rem;
            display: block;
            color: var(--accent);
        }

        h1 {
            margin: 0 0 0.75rem;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        p {
            margin: 0 0 0.75rem;
            color: var(--text-muted);
        }

        p:last-of-type {
            margin-bottom: 0;
        }

        .hint {
            margin-top: 1.75rem;
            padding-top: 1.25rem;
            border-top: 1px solid var(--border);
            font-size: 0.875rem;
        }

        @media (max-width: 30rem) {
            .card {
                padding: 2rem 1.25rem;
            }

            h1 {
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>
    <main class="card">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
             stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Wartung">
            <path d="M14.7 6.3a4 4 0 0 1 5 5L18 13l-7 7a2.8 2.8 0 0 1-4-4l7-7z"></path>
            <path d="M7.5 16.5 4 20"></path>
        </svg>
        <h1>Wartungsarbeiten</h1>
        <p>Die Anwendung wird gerade aktualisiert und ist kurzzeitig nicht erreichbar.</p>
        <p>Bitte in wenigen Minuten erneut versuchen. Es gehen keine Daten verloren.</p>
        <p class="hint">Dauert es länger als gewohnt? Dann bitte den Administrator informieren.</p>
    </main>
</body>
</html>
