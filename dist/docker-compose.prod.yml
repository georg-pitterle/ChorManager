x-app-environment: &app-environment
  APP_ENV: production
  DB_HOST: db
  DB_DATABASE: ${DB_DATABASE:?set in Portainer}
  DB_USERNAME: ${DB_USERNAME:?set in Portainer}
  DB_PASSWORD: ${DB_PASSWORD:?set in Portainer}
  DB_PORT: ${DB_PORT:-3306}
  SMTP_HOST: ${SMTP_HOST:?set in Portainer}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_AUTH: ${SMTP_AUTH:-1}
  SMTP_USERNAME: ${SMTP_USERNAME:?set in Portainer}
  SMTP_PASSWORD: ${SMTP_PASSWORD:?set in Portainer}
  SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-tls}
  SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:?set in Portainer}
  SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Chor Manager}
  REMEMBER_ME_DAYS: ${REMEMBER_ME_DAYS:-30}
  TZ: ${TZ:-Europe/Vienna}
  DISABLE_MAIL_SEND: ${DISABLE_MAIL_SEND:-true}
  APP_LOG_STREAM: ${APP_LOG_STREAM:-php://stderr}
  FEATURE_SHEET_ARCHIVE: ${FEATURE_SHEET_ARCHIVE:-false}
  FEATURE_BUDGET: ${FEATURE_BUDGET:-false}
  FEATURE_WEBMAIL: ${FEATURE_WEBMAIL:-false}
  FEATURE_NEWSLETTER: ${FEATURE_NEWSLETTER:-false}
  FEATURE_FINANCE: ${FEATURE_FINANCE:-false}
  FEATURE_SPONSORING: ${FEATURE_SPONSORING:-false}
  FEATURE_TASKS: ${FEATURE_TASKS:-false}
  FEATURE_REGISTRATION: ${FEATURE_REGISTRATION:-false}
  MAIL_CREDENTIAL_KEY: ${MAIL_CREDENTIAL_KEY:?set in Portainer}
  SNAPPYMAIL_SSO_SECRET: ${SNAPPYMAIL_SSO_SECRET:?set in Portainer}
  APP_URL: ${APP_URL:?set in Portainer}
  MAIL_ALLOW_PRIVATE_HOSTS: ${MAIL_ALLOW_PRIVATE_HOSTS:-0}
  # Must point into the backup_data volume mounted on the app service. The
  # application default lives inside the container's writable layer, where every
  # recreate would discard all backups.
  BACKUP_DIR: ${BACKUP_DIR:-/var/backups/chormanager}
  BACKUP_MAX_MANUAL: ${BACKUP_MAX_MANUAL:-5}
  BACKUP_MAX_AUTO: ${BACKUP_MAX_AUTO:-7}
  # Must point into the session_data volume mounted on the app service. PHP's
  # default location lives in the container's writable layer, so every recreate
  # discarded all sessions and logged every user out.
  SESSION_SAVE_PATH: ${SESSION_SAVE_PATH:-/var/lib/php-sessions}


services:
  app:
    image: ghcr.io/georg-pitterle/chormanager-app:latest
    restart: unless-stopped
    # Opt-in for the central Grafana Alloy running in the Loki stack. Alloy
    # discovers containers host-wide via the Docker socket; these labels tell it
    # which streams belong together and how to parse them. logs.format=monolog
    # switches on JSON parsing for this container only.
    labels:
      logs.job: "chormanager"
      logs.stack: "${STACK_ID:-prod}"
      logs.service: "app"
      logs.format: "monolog"
    working_dir: /var/www/html
    environment: *app-environment
    volumes:
      # Keeps in-app backups across image updates and stack recreations. The
      # entrypoint hands the mount to www-data on every start.
      - backup_data:${BACKUP_DIR:-/var/backups/chormanager}
      # Keeps login sessions alive across image updates and stack recreations.
      - session_data:${SESSION_SAVE_PATH:-/var/lib/php-sessions}
    depends_on:
      db:
        condition: service_healthy 
    networks:
      internal:
        aliases:
          - chormanager-fpm
      # Outbound-only network so the app can reach the user's external IMAP/SMTP
      # server (mailbox connection test + mail-badge polling). The internal
      # network is internal:true and has no egress; the db deliberately stays on
      # internal only. The app's FastCGI port 9000 stays unreachable from the
      # shared proxy network this way.
      egress:
    healthcheck:
      test: [ "CMD", "php", "-r", "if (@fsockopen('127.0.0.1',9000)) { exit(0); } exit(1);" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: mysql:8.4
    restart: unless-stopped
    labels:
      logs.job: "chormanager"
      logs.stack: "${STACK_ID:-prod}"
      logs.service: "db"
      logs.format: "raw"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-name-resolve
      # mysql_native_password is disabled by default in MySQL 8.4; enable it so
      # the plugin exists at all.
      - --mysql-native-password=ON
      # Force new accounts (incl. the MYSQL_USER created on first init) to use
      # mysql_native_password instead of the 8.4 default caching_sha2_password.
      # The app image's dump tool is the Alpine MariaDB client, which cannot
      # load the caching_sha2_password client plugin, so backups would otherwise
      # fail to authenticate (error 1045). See dist/README.md.
      - --authentication-policy=mysql_native_password
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?set in Portainer}
      MYSQL_USER: ${DB_USERNAME:?set in Portainer}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set in Portainer}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in Portainer}
      TZ: ${TZ:-Europe/Vienna}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    stop_grace_period: 1m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: ghcr.io/georg-pitterle/chormanager-web:latest
    hostname: chormanager-web-${STACK_ID:-prod}
    restart: unless-stopped
    labels:
      logs.job: "chormanager"
      logs.stack: "${STACK_ID:-prod}"
      logs.service: "web"
      logs.format: "raw"
    depends_on:
      - app
    networks:
      internal:
      proxy:
        aliases:
          - chormanager-web-${STACK_ID:-prod}
    expose:
      - "80"
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    read_only: true
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/css/style.css || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"   
  snappymail:
    image: ghcr.io/georg-pitterle/chormanager-snappymail:latest
    restart: unless-stopped
    labels:
      logs.job: "chormanager"
      logs.stack: "${STACK_ID:-prod}"
      logs.service: "snappymail"
      logs.format: "raw"
    environment:
      UPLOAD_MAX_SIZE: ${SNAPPYMAIL_UPLOAD_MAX_SIZE:-25M}
      MEMORY_LIMIT: ${SNAPPYMAIL_MEMORY_LIMIT:-128M}
      SECURE_COOKIES: "true"
      SNAPPYMAIL_SSO_SECRET: ${SNAPPYMAIL_SSO_SECRET:?set in Portainer}
    volumes:
      - snappymail_data:/var/lib/snappymail
    networks:
      proxy:
        aliases:
          - chormanager-snappymail-${STACK_ID:-prod}
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8888/ || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db_data:
  snappymail_data:
  backup_data:
  session_data:


networks:
  # No explicit name: Compose prefixes it with the stack name, so duplicated
  # stacks never share this network. A fixed name would let the chormanager-fpm
  # alias resolve across stacks and point web at the wrong app container.
  internal:
    driver: bridge
    internal: true
  egress:
    driver: bridge
  proxy:
    external: true
    name: portainer_network
