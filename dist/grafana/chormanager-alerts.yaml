# Grafana-Alarmregeln für den ChorManager-Stack.
#
# Die Betriebsregeln decken die Lücke der Wartungsseite ab: eine fehlgeschlagene
# Migration lässt den app-Container endlos neu starten, während Besucher
# weiterhin die freundliche Wartungsseite sehen. Ohne diese Regeln bleibt dieser
# Zustand unsichtbar.
#
# Einbau: Datei nach /etc/grafana/provisioning/alerting/ der Grafana-Instanz
# legen und Grafana neu starten. Datenquellen-UID (cfkh9luzn1wxsa), Ordner und
# Empfänger sind auf die bestehende Instanz eingestellt; eine neu angelegte
# Loki-Datenquelle bekommt eine andere UID und muss hier nachgezogen werden.
#
# ACHTUNG: Provisionierte Regeln gehören ab dann der Datei. Sie sind in der
# Oberfläche schreibgeschützt, Änderungen laufen über diese Datei plus Neustart,
# und ein Entfernen der Datei löscht die Regeln aus Grafana. Die Regel
# "Chormanager Chorkuma Errors" wurde bisher in der Oberfläche gepflegt; sie
# behält ihre UID und wird beim ersten Provisioning übernommen, nicht dupliziert.
#
# Benachrichtigt wird über den Kontaktpunkt "Chomano Kontakt". Eine eigene
# Notification Policy liefert diese Datei bewusst nicht mit, weil eine
# provisionierte Policy den gesamten Baum der Instanz ersetzen würde.
apiVersion: 1

groups:
  # Bestehende Regel, unverändert aus der Oberfläche übernommen.
  - orgId: 1
    name: 1m
    folder: Chorkuma
    interval: 1m
    rules:
      - uid: cfu78fbt3bzlsb
        title: Chormanager Chorkuma Errors
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error
        isPaused: false
        annotations: {}
        labels: {}
        notification_settings:
          receiver: Chomano Kontakt
        data:
          - refId: A
            queryType: range
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: cfkh9luzn1wxsa
            model:
              refId: A
              datasource:
                type: loki
                uid: cfkh9luzn1wxsa
              editorMode: code
              expr: sum(count_over_time({job="chormanager", stack="chorkuma", service="app"} | json | level_name=~`ERROR|CRITICAL|ALERT|EMERGENCY` [5m]))
              instant: true
              queryType: range
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: reducer
            queryType: expression
            datasourceUid: __expr__
            model:
              refId: reducer
              type: reduce
              datasource:
                name: Expression
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              intervalMs: 1000
              maxDataPoints: 43200
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params:
                      - 0
                      - 0
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    type: last
                    params: []
          - refId: C
            queryType: expression
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: reducer
              intervalMs: 1000
              maxDataPoints: 43200
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params:
                      - 0
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    type: last
                    params: []

  # Regeln rund um Update und Container-Start.
  - orgId: 1
    name: chormanager-betrieb
    folder: Chorkuma
    interval: 1m
    rules:
      # Fängt jede Absturzursache ab, auch die, für die es kein eigenes Ereignis
      # gibt: OOM-Kill, kaputtes Image, fehlende Umgebungsvariable. Drei Starts
      # in 15 Minuten sind kein normales Update mehr.
      - uid: cm-app-crashloop
        title: ChorManager App startet wiederholt neu
        condition: B
        for: 0m
        noDataState: OK
        execErrState: Error
        isPaused: false
        notification_settings:
          receiver: Chomano Kontakt
        labels:
          severity: critical
          app: chormanager
        annotations:
          summary: Der app-Container des Stacks {{ $labels.stack }} startet immer wieder neu.
          description: >-
            Mindestens drei Container-Starts in 15 Minuten. Besucher sehen währenddessen
            durchgehend die Wartungsseite. Ursache prüfen mit
            "docker compose logs -f app"; bei einer fehlgeschlagenen Migration greift
            zusätzlich die Regel "ChorManager App-Start abgebrochen".
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: cfkh9luzn1wxsa
            model:
              refId: A
              datasource:
                type: loki
                uid: cfkh9luzn1wxsa
              editorMode: code
              queryType: instant
              intervalMs: 60000
              maxDataPoints: 43200
              expr: 'sum by (stack) (count_over_time({job="chormanager", stack="chorkuma", service="app"} | json event="context.event" | event="app.boot.started" [15m]))'
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params:
                      - 2
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
                    params: []

      # Benennt die Ursache sofort, statt auf den dritten Neustart zu warten.
      - uid: cm-app-boot-failed
        title: ChorManager App-Start abgebrochen
        condition: B
        for: 0m
        noDataState: OK
        execErrState: Error
        isPaused: false
        notification_settings:
          receiver: Chomano Kontakt
        labels:
          severity: critical
          app: chormanager
        annotations:
          summary: Der Start des app-Containers im Stack {{ $labels.stack }} ist abgebrochen.
          description: >-
            Die Datenbank-Migration ist fehlgeschlagen oder die Datenbank war beim Start
            nicht erreichbar. Der Container startet in einer Schleife neu, Besucher sehen
            die Wartungsseite. Genaue Fehlermeldung im app-Log, Ereignisse
            "app.boot.migration_failed" und "app.boot.db_wait_timeout".
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: cfkh9luzn1wxsa
            model:
              refId: A
              datasource:
                type: loki
                uid: cfkh9luzn1wxsa
              editorMode: code
              queryType: instant
              intervalMs: 60000
              maxDataPoints: 43200
              expr: 'sum by (stack) (count_over_time({job="chormanager", stack="chorkuma", service="app"} | json event="context.event" | event=~"app.boot.migration_failed|app.boot.db_wait_timeout" [10m]))'
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params:
                      - 0
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
                    params: []

      # Letztes Netz: greift auch dann, wenn der app-Container so früh stirbt,
      # dass er gar nichts mehr nach Loki schreibt. Nginx protokolliert dann bei
      # jedem Zugriff einen Upstream-Fehler. Das 5-Minuten-Fenster zusammen mit
      # "for: 10m" hält ein gewöhnliches Update still: dessen Fehler versiegen,
      # sobald die neue App läuft.
      - uid: cm-web-upstream-down
        title: ChorManager Anwendung dauerhaft nicht erreichbar
        condition: B
        for: 10m
        noDataState: OK
        execErrState: Error
        isPaused: false
        notification_settings:
          receiver: Chomano Kontakt
        labels:
          severity: critical
          app: chormanager
        annotations:
          summary: Nginx im Stack {{ $labels.stack }} erreicht die Anwendung seit über zehn Minuten nicht.
          description: >-
            Der web-Container läuft und liefert die Wartungsseite aus, findet aber
            durchgehend keinen PHP-FPM-Upstream. Länger als ein Update dauert.
            Status prüfen mit "docker compose ps" und "docker compose logs -f app".
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: cfkh9luzn1wxsa
            model:
              refId: A
              datasource:
                type: loki
                uid: cfkh9luzn1wxsa
              editorMode: code
              queryType: instant
              intervalMs: 60000
              maxDataPoints: 43200
              expr: 'sum by (stack) (count_over_time({job="chormanager", stack="chorkuma", service="web"} |~ "could not be resolved|while connecting to upstream|upstream timed out|no live upstreams" [5m]))'
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params:
                      - 0
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
                    params: []
