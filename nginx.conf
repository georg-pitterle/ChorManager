server {
    listen 80;
    server_name localhost;

    # The reverse proxy in front of this container already logs every request,
    # including the real client IP. Here $remote_addr is only ever the proxy, so
    # the access log is a poorer duplicate and is dropped at the source instead
    # of being filtered out later in the log pipeline. The error log stays: it
    # carries the upstream timeouts, 413 rejections and FastCGI connect errors
    # that the proxy only sees as bare status codes.
    access_log off;

    client_max_body_size 100m;
    root /var/www/html/public;
    index index.php;

    # Docker's embedded DNS. Required so the FastCGI upstream below can be
    # resolved at request time instead of at startup.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Maintenance switch. /maintenance is a named volume shared with the host
    # operator, so the flag survives container recreates and can be toggled
    # without rebuilding or restarting anything:
    #   docker exec <web-container> touch  /maintenance/on
    #   docker exec <web-container> rm -f  /maintenance/on
    # Nothing is mounted there in dev, so the file test simply never matches.
    #
    # Bypass for smoke-testing a new version while the flag is still on: create
    # a token file and send its name back as a cookie. The token never lives in
    # the repository or in an environment variable this way.
    #   docker exec <web-container> sh -c 'touch /maintenance/bypass-$(head -c16 /dev/urandom | od -An -tx1 | tr -d " \n")'
    #   docker exec <web-container> ls /maintenance
    #   browser cookie: cm_maint=<token>
    set $maintenance 0;
    if (-f /maintenance/on) {
        set $maintenance 1;
    }
    if (-f /maintenance/bypass-$cookie_cm_maint) {
        set $maintenance 0;
    }

    # 502/504 cover the unplanned half: during every image update the app
    # container is gone for as long as it takes to boot, wait for the database
    # and run the Phinx migrations, because php-fpm only starts afterwards.
    # Nginx keeps serving throughout, so it can answer with the maintenance page
    # instead of the default Bad Gateway. The original status code is preserved,
    # which keeps search engines from indexing this page as real content.
    error_page 502 503 504 /maintenance.html;

    # Container healthcheck, deliberately exempt from the maintenance switch: it
    # reports whether Nginx itself serves, not whether the app is open to users.
    # Gating it would flag the container unhealthy for the whole maintenance
    # window. The app's own /health route stays behind the switch.
    location = /healthz {
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    location = /maintenance.html {
        root /usr/share/nginx/maintenance;
        internal;
        add_header Retry-After 300 always;
        add_header Cache-Control "no-store" always;
    }

    location / {
        if ($maintenance) {
            return 503;
        }
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        if ($maintenance) {
            return 503;
        }

        # A literal upstream is resolved once while Nginx boots: if the app
        # service is not up yet, Nginx aborts with "host not found in upstream"
        # and the container crash-loops. Going through a variable defers the
        # lookup to request time, so this container starts independently and
        # picks up a new app IP after every redeploy.
        set $fpm chormanager-fpm:9000;
        fastcgi_pass $fpm;
        fastcgi_index index.php;
        fastcgi_read_timeout 120s;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.ht {
        deny all;
    }
}
